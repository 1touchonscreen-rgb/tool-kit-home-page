<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
  <title>Title Case Converter</title>
<link rel="stylesheet" href="css/Case-Convert.css">
  
</head>
<body>

<!-- Hero -->
<section class="hero">
<div class="badge">
✨ Case Converter
</div>
<h1>Convert To Title Case</h1>
<p>
type text hare , Case Converter and get that you want
</p>
</section>

<div class="container">

  <h2>Title Case Converter</h2>
  
  <textarea id="inputText" rows="4" placeholder="Enter your content here..."></textarea>
  
  <button onclick="convertToTitleCase()">Convert to Title Case</button>
   <button onclick="convertToUpperCase()">Convert to Upper Case</button>
   <button onclick="convertToLowerCase()">Convert to Lower Case</button>
   <button onclick="convertToSentenceCase()">Convert to Sentence Case</button>
  
  <h5>Output:</h5>
  <textarea id="outputText" rows="4" readonly></textarea>

</div>
  <script src="js/Case-Convert.js"></script>
</body>
</html>
