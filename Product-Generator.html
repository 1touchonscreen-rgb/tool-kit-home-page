<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product JSON Manager</title>

    <link rel="stylesheet" href="css/Product-Generator.css">

</head>

<body>
     
    

    <div class="container">

        <h1>Product JSON Manager</h1>

        <p class="subtitle">
            Add New Product or Edit Existing Product
        </p>

        <div class="home-buttons">

            <button id="addProductBtn">
                ➕ Add New Product
            </button>

            <button id="editProductBtn">
                ✏️ Edit Product JSON
            </button>

        </div>
        <input
    type="file"
    id="jsonFile"
    accept=".json"
    style="display:none;">

        <div class="product-form" id="productForm" style="display:none;">

    <h2>Add New Product</h2>
    <button id="backBtn">⬅ Back</button>

    <label for="productId">Product ID</label>

<input
    type="number"
    id="productId"
    value="101">

<input type="text" id="productName" placeholder="Product Name">

<input type="number" id="productPrice" placeholder="Price">

<input
    type="text"
    id="productCategory"
    placeholder="Category (Example: delay-spray)">

<input type="text" id="productImages" placeholder="Image Names (example: product1.jpg, product2.jpg)">

<input type="text" id="productTags" placeholder="Tags (comma separated)">

<textarea id="shortDescription" placeholder="Short Description"></textarea>

<textarea id="longDescription"></textarea>

<button id="downloadBtn">📥 Download Product JSON</button>
</div>

    </div>
    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js"></script>
   <script src="js/Product-Generator.js"></script>

</body>

</html>
